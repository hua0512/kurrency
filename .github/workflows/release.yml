name: Release

# A `v*` tag builds every package and attaches them, with SHA256SUMS, to a
# draft GitHub Release; publishing the draft is a manual step (docs/RELEASING.md).
# Running the workflow by hand builds the same packages as workflow artifacts
# only, to try the packaging without a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  CARGO_PACKAGER_VERSION: 0.11.8

# Release builds start clean, with no rust-cache: tags are rare, a cache saved
# from a tag ref is only visible to that tag, and a package then never contains
# anything left over from an earlier build.
#
# Every package is built with `--profile dist` (the root Cargo.toml: the
# release profile with fat LTO), so the binaries are in target/<triple>/dist,
# and `cargo packager --profile dist` reads them from there.

jobs:
  linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the glibc requirement at 2.35, so the tarball and
          # AppImage run on older distributions too.
          - arch: x86_64
            os: ubuntu-22.04
          - arch: aarch64
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      - name: Install system libraries
        run: .github/scripts/install-linux-deps.sh
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-packager@${{ env.CARGO_PACKAGER_VERSION }}
      - name: Build
        run: cargo build --profile dist --locked --target "$TARGET"
      # cargo-packager works from the directory of its configuration
      # (crates/kurrency/Cargo.toml). It makes an existing --out-dir absolute
      # first, so `dist` is created here, at the root, beforehand.
      - name: Package (.deb, AppImage)
        run: |
          mkdir -p dist
          cargo packager --profile dist --target "$TARGET" --formats deb,appimage --out-dir dist
      - name: Package (tar.gz)
        run: scripts/package-linux-tarball.sh "target/$TARGET/dist/kurrency" "${{ matrix.arch }}" dist
      # linuxdeploy bundles the libraries the binary links, minus the host
      # libraries on the AppImage exclude list; show what it shipped.
      - name: Inspect the AppImage
        run: |
          appimage=$(ls dist/*.AppImage)
          "$appimage" --appimage-extract > /dev/null
          find squashfs-root -type f -name '*.so*' | sort
          rm -rf squashfs-root
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error

  macos:
    name: macOS (universal)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # The x86_64 slice's minimum; keep it equal to `minimum-system-version`
      # in crates/kurrency/Cargo.toml (rustc's aarch64 default is already 11.0).
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      # Signing and notarisation run only when these secrets exist; otherwise
      # the .app and .dmg are unsigned. GitHub cannot test secrets in `if:`,
      # so they are read through the environment.
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-packager@${{ env.CARGO_PACKAGER_VERSION }}
      - name: Build (aarch64)
        run: cargo build --profile dist --locked --target aarch64-apple-darwin
      - name: Build (x86_64)
        run: cargo build --profile dist --locked --target x86_64-apple-darwin
      # cargo-packager reads `--target universal-apple-darwin --profile dist`
      # binaries from target/universal-apple-darwin/dist.
      - name: Make the universal binary
        run: |
          mkdir -p target/universal-apple-darwin/dist
          lipo -create -output target/universal-apple-darwin/dist/kurrency \
            target/aarch64-apple-darwin/dist/kurrency \
            target/x86_64-apple-darwin/dist/kurrency
          lipo -info target/universal-apple-darwin/dist/kurrency
      - name: Configure signing
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: |
          perl -0pi -e 's/(\[package\.metadata\.packager\.macos\]\n)/$1signing-identity = "$ENV{APPLE_SIGNING_IDENTITY}"\n/' crates/kurrency/Cargo.toml
          grep -A3 '^\[package.metadata.packager.macos\]' crates/kurrency/Cargo.toml
      - name: Package (.app, .dmg)
        run: |
          # cargo-packager treats a set-but-empty variable as a credential.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || unset "$name"
          done
          # An existing --out-dir is made absolute (see the Linux job).
          mkdir -p dist
          cargo packager --profile dist --target universal-apple-darwin --formats app,dmg --out-dir dist
      - name: Verify the bundle
        run: |
          ls -la dist
          lipo -info dist/Kurrency.app/Contents/MacOS/kurrency
          plutil -p dist/Kurrency.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 dist/Kurrency.app || echo "::notice::Kurrency.app is unsigned"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-universal
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TARGET: x86_64-pc-windows-msvc
      # Authenticode signing runs only when the certificate secret exists.
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-packager@${{ env.CARGO_PACKAGER_VERSION }}
      - name: Build
        run: cargo build --profile dist --locked --target "$TARGET"
      - name: Sign the executable
        if: env.WINDOWS_CERTIFICATE != ''
        run: .github/scripts/sign-windows.sh "target/$TARGET/dist/kurrency.exe"
      - name: Package (NSIS installer)
        # An existing --out-dir is made absolute (see the Linux job).
        run: |
          mkdir -p dist
          cargo packager --profile dist --target "$TARGET" --formats nsis --out-dir dist
      - name: Sign the installer
        if: env.WINDOWS_CERTIFICATE != ''
        run: .github/scripts/sign-windows.sh dist/*-setup.exe
      - name: Package (portable zip)
        run: |
          # [workspace.package] in the root Cargo.toml.
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          name="kurrency-$version-x86_64-windows"
          mkdir -p "stage/$name/licenses"
          cp "target/$TARGET/dist/kurrency.exe" LICENSE NOTICE README.md "stage/$name/"
          cp assets/fonts/OFL.txt "stage/$name/licenses/Inter-OFL.txt"
          cp assets/fonts/NotoSansSC-OFL.txt "stage/$name/licenses/NotoSansSC-OFL.txt"
          cp assets/flags/LICENSE "stage/$name/licenses/flag-icons-MIT.txt"
          (cd stage && 7z a -tzip "../dist/$name.zip" "$name" > /dev/null)
          ls -la dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x86_64
          path: |
            dist/*-setup.exe
            dist/*.zip
          if-no-files-found: error

  release:
    name: Draft the GitHub Release
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
