name: CI

on:
  push:
    branches: [main]
    paths-ignore: &docs-only
      - "**.md"
      - "assets/screenshots/**"
      - "LICENSE"
      - "NOTICE"
  pull_request:
    paths-ignore: *docs-only
  workflow_dispatch:

# A new push to a pull request cancels its running checks; runs on `main` all
# finish, so every commit there has a result and saves the cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1

# All jobs run in parallel so CI wall-clock time is bounded by the single
# slowest job rather than `lint + test`. Caching and toolchain isolation live
# in `.github/actions/setup-rust`: only `main` saves caches, PRs restore `main`'s
# (so PRs never evict `main` from the 10 GB quota), and each build kind uses its
# own `shared-key` so clippy metadata and test binaries do not overwrite each
# other.
jobs:
  lint:
    name: Lint (fmt, clippy)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt,clippy
          cache: "true"
          shared-key: clippy-ci
      - name: Format
        run: cargo fmt --all --check
      - name: Check rust-version matches rust-toolchain.toml
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          pinned_minor="${channel%.*}"
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ -z "$channel" ] || [ -z "$msrv" ] || [ "$pinned_minor" != "$msrv" ]; then
            echo "::error file=Cargo.toml::rust-version ($msrv) does not match rust-toolchain.toml ($channel)."
            exit 1
          fi
      # kurrency-core must build without GPUI (so its tests stay fast and
      # headless); this reads the resolved graph for every target platform,
      # without compiling anything.
      - name: Check that kurrency-core does not depend on GPUI
        run: |
          deps=$(cargo tree --locked -p kurrency-core --target all -e normal,build,dev --prefix none)
          if grep -E '^gpui' <<< "$deps"; then
            echo "::error file=crates/kurrency-core/Cargo.toml::kurrency-core depends on GPUI (above); only crates/kurrency may."
            exit 1
          fi
      - name: Install system libraries
        run: .github/scripts/install-linux-deps.sh
      # `--profile ci` inherits `dev` while dropping debug info from dependency
      # proc-macros and build scripts, keeping the clippy cache smaller and
      # faster on cold builds with identical lint coverage.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --profile ci --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache: "true"
          shared-key: test
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: .github/scripts/install-linux-deps.sh
      # mold (Linux) and lld-link (Windows) link the test binaries faster than
      # GNU ld / MSVC link.exe. Configured here, not in the repository, so local
      # builds keep their own linker.
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
        if: runner.os == 'Linux'
      - name: Configure lld-link
        if: runner.os == 'Windows'
        run: |
          if command -v lld-link >/dev/null 2>&1; then
            echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=lld-link" >> "$GITHUB_ENV"
          fi
      # Both crates' tests in one build. The UI tests (`#[gpui_kit::test]`)
      # run on GPUI's test platform, which needs no display, window server or
      # GPU, so they run on every OS here.
      - name: Test
        run: cargo nextest run --workspace --cargo-profile ci --profile ci --locked
      # nextest does not run doctests; rustdoc has them for kurrency-core, the
      # one library target (the app is a binary).
      - name: Doctests
        run: cargo test --workspace --doc --profile ci --locked

  # The newest stable Rust, which rust-toolchain.toml lags until its manual
  # bump: new lints and compiler changes show up here first, without failing
  # the pinned checks above.
  stable:
    name: Clippy (latest stable)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: clippy
          cache: "true"
          shared-key: clippy-stable-ci
      # Dependabot cannot bump rust-toolchain.toml, so say when it is behind.
      - name: Check the pinned toolchain is current
        run: |
          pinned=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          stable=$(rustc --version | cut -d' ' -f2)
          if [ "$pinned" != "$stable" ]; then
            echo "::warning file=rust-toolchain.toml::Rust $stable is out; the toolchain is pinned to $pinned. Bump rust-toolchain.toml and rust-version (docs/RELEASING.md)."
          fi
      - name: Install system libraries
        run: .github/scripts/install-linux-deps.sh
      - name: Clippy
        run: cargo clippy --workspace --all-targets --profile ci --locked -- -D warnings
