version: 2
updates:
  # The workspace root: [workspace.dependencies] in Cargo.toml holds every
  # crate's version requirements, and Cargo.lock is shared.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One pull request a week for everything semver-compatible.
      cargo-minor-patch:
        update-types: [minor, patch]
    ignore:
      # gpui-kit and the gpui-pre snapshot crates are pinned with `=`: a
      # snapshot may change GPUI's API, so they are bumped together by hand,
      # with Cargo.lock, when gpui-kit releases.
      - dependency-name: gpui-kit
      - dependency-name: "gpui-pre*"
      - dependency-name: "gpui-*"
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
