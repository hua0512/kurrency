<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C1C20"/>
      <stop offset="1" stop-color="#111113"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#tile)"/>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#sheen)"/>
  <rect x="33" y="33" width="958" height="958" rx="219" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>
  <g fill="none" stroke="#F4F4F5" stroke-width="64" stroke-linecap="round" stroke-linejoin="round">
    <!-- stem -->
    <path d="M352 272 V752"/>
    <!-- upper diagonal: junction -> NE, arrowhead at end -->
    <path d="M392 512 L672 272"/>
    <path d="M540 272 H672 V404"/>
    <!-- lower diagonal: flows back NW into the junction, open chevron at the tip -->
    <path d="M672 752 L480 560"/>
    <path d="M480 680 V560 H600"/>
  </g>
  <!-- slate accent: thin stroke parallel to the lower diagonal -->
  <path d="M668 588 L756 676" stroke="#9DB5B2" stroke-width="14" stroke-linecap="round"/>
</svg>
